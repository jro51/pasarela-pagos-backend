cors:
  # Origenes permitidos separados por coma. En produccion definir CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

jwt:
  # En produccion definir la variable de entorno JWT_SECRET (minimo 32 caracteres).
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please-123456}
  # 10 horas por defecto; configurable por variable de entorno.
  expiration-ms: ${JWT_EXPIRATION_MS:36000000}

spring:
  data:
    web:
      pageable:
        max-page-size: 50
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pasarela_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
