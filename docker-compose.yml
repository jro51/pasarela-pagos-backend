version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: pasarela_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pasarela_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: